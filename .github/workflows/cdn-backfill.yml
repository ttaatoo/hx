name: CDN Backfill

# hx does not use a Vercel blob CDN. Stable artifacts are GitHub Release
# tarballs such as hx-macos-arm64.tar.gz.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - name: No Vercel CDN
        run: |
          echo "ttaatoo/hx publishes GitHub Releases only."
          echo "There is no releases.fx.sh / blob.vercel-storage.com backfill."
