name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The pull_request event keeps forked PRs on a read-only token.
permissions:
  contents: read

jobs:
  zig_mode:
    name: Build & Test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - optimize: ReleaseSafe
            test_timeout_seconds: 900
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: ci-unit-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Validate PGSO corpus classification
        run: python3 -m scripts.pgso.corpus --manifest scripts/pgso/corpus.json --list

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Test
        env:
          TEST_TIMEOUT_SECONDS: ${{ matrix.test_timeout_seconds }}
        run: |
          started_at=$SECONDS
          status=0
          timeout "${TEST_TIMEOUT_SECONDS}s" zig build test -Doptimize=${{ matrix.optimize }} || status=$?
          printf "Unit tests elapsed: %ss\n" "$((SECONDS - started_at))"
          exit "$status"

  zig:
    name: Build & Test
    if: ${{ always() }}
    needs: zig_mode
    runs-on: ubuntu-latest
    steps:
      - name: Require ReleaseSafe
        env:
          MATRIX_RESULT: ${{ needs.zig_mode.result }}
        run: test "$MATRIX_RESULT" = success

  e2e_mode:
    name: E2E (deterministic, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [ReleaseSafe]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: ci-e2e-${{ matrix.optimize }}

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install e2e deps
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Install isolated MCP conformance package
        run: npm ci
        working-directory: tests/e2e/conformance

      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tmux
          fi

      - name: Run CLI tests
        run: bun test cli.test.ts
        working-directory: tests/e2e

      - name: Run ACP tests (no-key subset)
        run: bun test acp.test.ts
        working-directory: tests/e2e

      - name: Run stdio MCP dispatcher lifecycle tests
        run: bun test mcp-stdio.test.ts
        working-directory: tests/e2e

      - name: Run modern MCP Streamable HTTP tests
        run: bun test mcp-http.test.ts
        working-directory: tests/e2e

      - name: Run legacy MCP remote compatibility tests
        run: bun test mcp-legacy-remote.test.ts
        working-directory: tests/e2e

      - name: Run isolated MCP conformance baseline
        run: npm test
        working-directory: tests/e2e/conformance
        env:
          FX_SOUND: "0"

      - name: Run persistence tests
        run: bun test config-persistence.test.ts session-recovery.test.ts prompt-history.test.ts
        working-directory: tests/e2e

      - name: Run TUI input line deletion regression
        run: |
          tmux -V
          bun test tui-input-line-delete.test.ts
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

      - name: Run multiline input navigation TUI tests
        run: |
          tmux -V
          bun test tui-input-navigation.test.ts
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

      - name: Run valid question recovery TUI regression
        run: |
          tmux -V
          bun test ./tui-decision-prompts.test.ts --test-name-pattern "valid serialized ask control with matching identity opens the question and continues"
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

      - name: Run direct-write audit regression
        run: |
          tmux -V
          bun test tui-direct-write-audit.test.ts
        working-directory: tests/e2e
        env:
          FX_REQUIRE_TMUX: "1"

  e2e:
    name: E2E (deterministic)
    if: ${{ always() }}
    needs: e2e_mode
    runs-on: ubuntu-latest
    steps:
      - name: Require ReleaseSafe
        env:
          MATRIX_RESULT: ${{ needs.e2e_mode.result }}
        run: test "$MATRIX_RESULT" = success

  cross-target:
    name: Cross-target Compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: ci-cross-target-${{ matrix.name }}

      - name: Build target
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Report binary size
        run: |
          bytes=$(stat -c%s zig-out/bin/hx)
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
          echo "${{ matrix.name }}: $bytes bytes ($mib MiB)"
          echo "${{ matrix.name }}: $bytes bytes ($mib MiB)" >> "$GITHUB_STEP_SUMMARY"

  lint-scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Shellcheck hx scripts
        run: |
          scripts=(
            benchmarks/startup.sh
            scripts/check-public-surface.sh
          )
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"

  e2e_acp_full_mode:
    name: E2E ACP (full, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        optimize: [ReleaseSafe]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
          cache-key: ci-acp-full-${{ matrix.optimize }}

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install e2e deps
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Run full ACP tests
        run: bun test acp.test.ts
        working-directory: tests/e2e

  e2e-acp-full:
    name: E2E ACP (full)
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: e2e_acp_full_mode
    runs-on: ubuntu-latest
    steps:
      - name: Require ReleaseSafe
        env:
          MATRIX_RESULT: ${{ needs.e2e_acp_full_mode.result }}
        run: test "$MATRIX_RESULT" = success
