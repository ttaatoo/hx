name: Full CI

on:
  workflow_dispatch:
  push:

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Native and E2E are separate jobs per platform so Linux E2E can start as soon
# as Linux native uploads. A matrix `needs: native` waits for every platform,
# including queued macos-15-intel, before any shard starts.
# Displayed check names stay Native checks (ReleaseSafe, $target) and
# E2E (ReleaseSafe, $target, shard N/4) for release.yml and full-suite.

jobs:
  native-linux-x86_64:
    name: Native checks (ReleaseSafe, linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/full-ci-native
        with:
          platform: linux-x86_64
          optimize: ReleaseSafe

  native-linux-aarch64:
    name: Native checks (ReleaseSafe, linux-aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/full-ci-native
        with:
          platform: linux-aarch64
          optimize: ReleaseSafe

  native-macos-x86_64:
    name: Native checks (ReleaseSafe, macos-x86_64)
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/full-ci-native
        with:
          platform: macos-x86_64
          optimize: ReleaseSafe

  native-macos-aarch64:
    name: Native checks (ReleaseSafe, macos-aarch64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/full-ci-native
        with:
          platform: macos-aarch64
          optimize: ReleaseSafe

  e2e-linux-x86_64:
    name: E2E (ReleaseSafe, linux-x86_64, shard ${{ matrix.shard.label }})
    needs: native-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { index: 0, shard_count: 4, label: "1/4" }
          - { index: 1, shard_count: 4, label: "2/4" }
          - { index: 2, shard_count: 4, label: "3/4" }
          - { index: 3, shard_count: 4, label: "4/4" }
    env:
      FX_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/full-ci-e2e
        with:
          platform: linux-x86_64

  e2e-linux-aarch64:
    name: E2E (ReleaseSafe, linux-aarch64, shard ${{ matrix.shard.label }})
    needs: native-linux-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { index: 0, shard_count: 4, label: "1/4" }
          - { index: 1, shard_count: 4, label: "2/4" }
          - { index: 2, shard_count: 4, label: "3/4" }
          - { index: 3, shard_count: 4, label: "4/4" }
    env:
      FX_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/full-ci-e2e
        with:
          platform: linux-aarch64

  e2e-macos-x86_64:
    name: E2E (ReleaseSafe, macos-x86_64, shard ${{ matrix.shard.label }})
    needs: native-macos-x86_64
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { index: 0, shard_count: 4, label: "1/4" }
          - { index: 1, shard_count: 4, label: "2/4" }
          - { index: 2, shard_count: 4, label: "3/4" }
          - { index: 3, shard_count: 4, label: "4/4" }
    env:
      FX_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/full-ci-e2e
        with:
          platform: macos-x86_64

  e2e-macos-aarch64:
    name: E2E (ReleaseSafe, macos-aarch64, shard ${{ matrix.shard.label }})
    needs: native-macos-aarch64
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { index: 0, shard_count: 4, label: "1/4" }
          - { index: 1, shard_count: 4, label: "2/4" }
          - { index: 2, shard_count: 4, label: "3/4" }
          - { index: 3, shard_count: 4, label: "4/4" }
    env:
      FX_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/full-ci-e2e
        with:
          platform: macos-aarch64

  full-suite:
    name: Full suite (${{ matrix.name }})
    if: ${{ always() }}
    needs:
      - native-linux-x86_64
      - native-linux-aarch64
      - native-macos-x86_64
      - native-macos-aarch64
      - e2e-linux-x86_64
      - e2e-linux-aarch64
      - e2e-macos-x86_64
      - e2e-macos-aarch64
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # gh api reads this run's job conclusions to verify every matrix leg.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        name:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64
    steps:
      - name: Verify native and E2E matrices
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.name }}
        run: |
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
          jq -e --arg target "$TARGET" '
            ([
              "Native checks (ReleaseSafe, " + $target + ")",
              (range(1; 5) as $shard
                | "E2E (ReleaseSafe, " + $target + ", shard " + ($shard | tostring) + "/4)")
            ] | sort) as $expected
            |
            [
              .jobs[]
              | select(
                  (.name == ("Native checks (ReleaseSafe, " + $target + ")")) or
                  (.name | startswith("E2E (ReleaseSafe, " + $target + ", shard "))
              )
            ] as $selected
            | (($selected | map(.name) | sort) == $expected and
               all($selected[]; .conclusion == "success"))
          ' <<< "$jobs"

  ship-gate:
    name: Ship gate
    if: ${{ always() }}
    needs: full-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all Full suite matrix jobs
        env:
          FULL_SUITE_RESULT: ${{ needs.full-suite.result }}
        run: |
          set -euo pipefail
          test "$FULL_SUITE_RESULT" = success
