name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bench:
    name: Startup Latency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Install hyperfine
        env:
          # PGSO pins Hyperfine 1.20.0; this is its amd64 Debian asset digest.
          HYPERFINE_VERSION: "1.20.0"
          HYPERFINE_SHA256: "e0391897ffb490af8a6b64e0e4281ac2c8e10cbcbb875bd22a376f44cdb263ab"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hyperfine_${HYPERFINE_VERSION}_amd64.deb"
          wget --quiet --output-document="$archive" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/hyperfine_${HYPERFINE_VERSION}_amd64.deb"
          printf '%s  %s\n' "$HYPERFINE_SHA256" "$archive" | sha256sum --check --strict -
          sudo dpkg -i "$archive"

      - name: Run benchmarks
        run: ./benchmarks/startup.sh --ci

      - name: Enforce latency budgets
        run: python3 benchmarks/check_budgets.py

      - name: Run UI activity progress benchmark
        run: |
          for run in 1 2 3; do
            echo "UI activity benchmark run ${run}/3"
            zig build run-bench-ui-activity -Doptimize=ReleaseSafe
          done
