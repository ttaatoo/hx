name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Publish the current src/main.zig version if no GitHub Release exists. Never replaces an existing GitHub Release."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            if [ "$FORCE" = "true" ]; then
              echo "GitHub Release ${TAG} already exists; refusing to clobber even with force"
            else
              echo "GitHub Release ${TAG} exists, no release needed"
            fi
            exit 0
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "${TAG}^{commit}")
            HEAD_SHA=$(git rev-parse "${GITHUB_SHA}^{commit}")
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag ${TAG} exists on ${TAG_SHA}, not this commit ${HEAD_SHA}. Do not reuse an inherited tag. Bump src/main.zig."
              echo "needed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "Tag ${TAG} already points at this commit; GitHub Release is missing"
          else
            echo "Tag ${TAG} is missing"
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "No GitHub Release for ${TAG}; release needed"

  build:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        # sha256sum is available on all ubuntu runners used in this workflow
        run: |
          package_dir="$RUNNER_TEMP/hx-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/hx LICENSE NOTICE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf hx-${{ matrix.name }}.tar.gz -C "$package_dir" hx LICENSE NOTICE THIRD_PARTY_NOTICES.md
          sha256sum hx-${{ matrix.name }}.tar.gz > hx-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hx-${{ matrix.name }}
          path: |
            hx-${{ matrix.name }}.tar.gz
            hx-${{ matrix.name }}.tar.gz.sha256

  build-macos-arm64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build macos-aarch64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require native arm64 host
        run: test "$(uname -m)" = arm64

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Package
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/hx-package-macos-aarch64"
          mkdir -p "$package_dir"
          cp zig-out/bin/hx LICENSE NOTICE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf hx-macos-aarch64.tar.gz -C "$package_dir" hx LICENSE NOTICE THIRD_PARTY_NOTICES.md
          shasum -a 256 hx-macos-aarch64.tar.gz > hx-macos-aarch64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hx-macos-aarch64
          path: |
            hx-macos-aarch64.tar.gz
            hx-macos-aarch64.tar.gz.sha256

  release:
    needs: [check-version, build, build-macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hx-*
          merge-multiple: true

      - name: Alias macOS arm64 tarball for the Homebrew formula
        run: |
          set -euo pipefail
          # Native macos-15 packages hx-macos-aarch64.tar.gz (upgrade platform id).
          # Formula/hx.rb downloads hx-macos-arm64.tar.gz from the GitHub Release.
          if [ -f hx-macos-aarch64.tar.gz ]; then
            cp hx-macos-aarch64.tar.gz hx-macos-arm64.tar.gz
            sha256sum hx-macos-arm64.tar.gz > hx-macos-arm64.tar.gz.sha256
          fi

      - name: Create git tag
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${RELEASE_TAG} exists on ${TAG_SHA}; not moving it"
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already exists on this commit"
          else
            git tag -- "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Extract changelog entry
        run: |
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md
          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes ($LINES lines)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/release-notes.md
          fail_on_unmatched_files: true
          files: |
            hx-*.tar.gz
            hx-*.tar.gz.sha256
