name: Full CI e2e
description: Download the platform ReleaseSafe hx and run one deterministic E2E shard

inputs:
  platform:
    description: Platform key matching the native upload artifact
    required: true

runs:
  using: composite
  steps:
    # E2E shards consume that platform's native ReleaseSafe binary. Do not
    # install Zig or compile here: that was 16 extra full compiles per run.
    - name: Download ReleaseSafe binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: hx-full-ci-${{ inputs.platform }}-${{ github.sha }}
        # Preserve zig-out/bin/<name> from the native upload.
        path: .

    - name: Restore executable bit
      shell: bash
      run: |
        set -euo pipefail
          test -f zig-out/bin/hx
          test -s zig-out/bin/hx
          test -f zig-out/bin/mcp-stdio-dispatcher-driver
          test -f zig-out/bin/terminal-client-fixture
          chmod +x zig-out/bin/hx \
            zig-out/bin/mcp-stdio-dispatcher-driver \
            zig-out/bin/terminal-client-fixture
          ./zig-out/bin/hx help >/dev/null

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3.14"

    - name: Install E2E system dependencies
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          missing=()
          command -v tmux >/dev/null 2>&1 || missing+=(tmux)
          command -v zsh >/dev/null 2>&1 || missing+=(zsh)
          if [ "${#missing[@]}" -gt 0 ]; then
            retry() {
              local attempt
              for attempt in 1 2; do
                if "$@"; then
                  return 0
                fi
                if [ "$attempt" -lt 2 ]; then
                  printf 'Dependency install attempt %s failed; retrying in 5s\n' "$attempt" >&2
                  sleep 5
                fi
              done
              return 1
            }
            # The Azure mirror can stall after APT has already fetched release
            # metadata from the direct Ubuntu fallback. Prefer that fallback
            # for the whole update when the runner's mirror list provides it.
            if [ -f /etc/apt/apt-mirrors.txt ] &&
              grep -Eq '^https?://(archive|ports)\.ubuntu\.com/' /etc/apt/apt-mirrors.txt
            then
              sudo sed -i '/:\/\/azure\..*ubuntu\.com\//d' /etc/apt/apt-mirrors.txt
            fi
            retry sudo timeout --kill-after=15s 4m apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update
            retry sudo timeout --kill-after=15s 3m apt-get \
              -o Dpkg::Use-Pty=0 \
              install -y "${missing[@]}"
          fi
        elif ! command -v tmux >/dev/null 2>&1; then
          brew install tmux
        fi
        printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
        tmux -V
        zsh --version

    - name: Install E2E dependencies
      shell: bash
      working-directory: tests/e2e
      run: bun install --frozen-lockfile

    - name: Run deterministic E2E shard
      shell: bash
      working-directory: tests/e2e
      run: |
        selected=()
        selection_file="$RUNNER_TEMP/fx-e2e-shard-${SHARD_INDEX}.txt"
        bun ci-shards.ts \
          --shard-count "$SHARD_COUNT" \
          --shard-index "$SHARD_INDEX" > "$selection_file"
        while IFS= read -r test_file; do
          selected+=("$test_file")
        done < "$selection_file"

        test "${#selected[@]}" -gt 0
        printf 'Running E2E shard %s/%s (%s files):\n' "$((SHARD_INDEX + 1))" "$SHARD_COUNT" "${#selected[@]}"
        printf '  %s\n' "${selected[@]}"

        shard_status=0
        test_number=0
        for test_file in "${selected[@]}"; do
          tmux_tmp_dir="$RUNNER_TEMP/fx-e2e-tmux-${SHARD_INDEX}-${test_number}"
          mkdir -p "$tmux_tmp_dir"
          if ! TMUX_TMPDIR="$tmux_tmp_dir" bun test --max-concurrency 1 "./$test_file"; then
            printf 'Retrying failed E2E file after resetting tmux: %s\n' "$test_file"
            TMUX_TMPDIR="$tmux_tmp_dir" tmux kill-server 2>/dev/null || true
            if ! TMUX_TMPDIR="$tmux_tmp_dir" bun test --max-concurrency 1 "./$test_file"; then
              shard_status=1
            fi
          fi
          TMUX_TMPDIR="$tmux_tmp_dir" tmux kill-server 2>/dev/null || true
          test_number=$((test_number + 1))
        done
        exit "$shard_status"
