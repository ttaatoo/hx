name: Setup PGSO tools
description: Install and verify the tools required by one distributed PGSO phase

inputs:
  zig:
    description: Install pinned Zig
    required: false
    default: "false"
  llvm:
    description: Install and verify LLVM 21.1.8
    required: false
    default: "false"
  bun:
    description: Install pinned Bun and tmux
    required: false
    default: "false"
  hyperfine:
    description: Install pinned Hyperfine
    required: false
    default: "false"

outputs:
  llvm-bin:
    description: Absolute LLVM bin directory
    value: ${{ steps.llvm.outputs.path }}
  bun-bin:
    description: Absolute Bun executable
    value: ${{ steps.runtime.outputs.bun }}
  hyperfine-bin:
    description: Absolute Hyperfine executable
    value: ${{ steps.hyperfine.outputs.path }}

runs:
  using: composite
  steps:
    - name: Setup Zig
      if: inputs.zig == 'true' || inputs.llvm == 'true'
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      with:
        version: "0.16.0"
        cache-key: pgso-macos-arm64

    - name: Install verified LLVM
      id: llvm
      if: inputs.llvm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        formula_json="$RUNNER_TEMP/llvm-21-formula.json"
        curl -fsSL https://formulae.brew.sh/api/formula/llvm@21.json -o "$formula_json"
        jq -e '
          .versions.stable == "21.1.8" and
          .bottle.stable.files.arm64_sequoia.sha256 ==
            "71f4ead77d52d42da9dd7f34441b45304474837b7ace887c7669048f830df6e6"
        ' "$formula_json" >/dev/null
        brew install llvm@21
        llvm_bin="$(brew --prefix llvm@21)/bin"
        "$llvm_bin/opt" --version | grep -F "version 21.1.8"
        echo "path=$llvm_bin" >> "$GITHUB_OUTPUT"

    - name: Setup Bun
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"

    - name: Restore pinned tmux
      if: inputs.bun == 'true'
      id: tmux-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.tool_cache }}/hx-pgso/tmux-3.6a
        key: hx-pgso-tmux-3.6a-libevent-2.1.12-${{ runner.os }}-${{ runner.arch }}

    - name: Build pinned tmux
      if: inputs.bun == 'true' && steps.tmux-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        build_root="$RUNNER_TEMP/hx-pgso-tmux-build"
        prefix="$RUNNER_TOOL_CACHE/hx-pgso/tmux-3.6a"
        libevent_archive="$build_root/libevent-2.1.12-stable.tar.gz"
        tmux_archive="$build_root/tmux-3.6a.tar.gz"
        mkdir -p "$build_root" "$prefix"
        show_build_logs() {
          status=$?
          if [ "$status" -ne 0 ]; then
            for log in "$build_root"/*.log; do
              [ -f "$log" ] || continue
              echo "--- $log"
              tail -100 "$log"
            done
          fi
          exit "$status"
        }
        trap show_build_logs EXIT

        curl -fsSL \
          https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz \
          -o "$libevent_archive"
        printf '%s  %s\n' \
          92e6de1be9ec176428fd2367677e61ceffc2ee1cb119035037a27d346b0403bb \
          "$libevent_archive" | shasum -a 256 -c -
        tar -xzf "$libevent_archive" -C "$build_root"
        (
          cd "$build_root/libevent-2.1.12-stable"
          ./configure \
            --prefix="$prefix" \
            --disable-shared \
            --enable-static \
            --disable-openssl > "$build_root/libevent-configure.log" 2>&1
          make -j"$(sysctl -n hw.ncpu)" > "$build_root/libevent-make.log" 2>&1
          make install > "$build_root/libevent-install.log" 2>&1
        )

        curl -fsSL \
          https://github.com/tmux/tmux/releases/download/3.6a/tmux-3.6a.tar.gz \
          -o "$tmux_archive"
        printf '%s  %s\n' \
          b6d8d9c76585db8ef5fa00d4931902fa4b8cbe8166f528f44fc403961a3f3759 \
          "$tmux_archive" | shasum -a 256 -c -
        tar -xzf "$tmux_archive" -C "$build_root"
        (
          cd "$build_root/tmux-3.6a"
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig" \
            CPPFLAGS="-I$prefix/include" \
            LDFLAGS="-L$prefix/lib" \
            ./configure \
              --prefix="$prefix" \
              --disable-utf8proc > "$build_root/tmux-configure.log" 2>&1
          make -j"$(sysctl -n hw.ncpu)" > "$build_root/tmux-make.log" 2>&1
          make install > "$build_root/tmux-install.log" 2>&1
        )
        trap - EXIT

    - name: Verify tmux and record Bun
      id: runtime
      if: inputs.bun == 'true'
      shell: bash
      run: |
        set -euo pipefail
        tmux_bin="$RUNNER_TOOL_CACHE/hx-pgso/tmux-3.6a/bin/tmux"
        test -x "$tmux_bin"
        test "$(bun --version)" = "1.3.14"
        test "$("$tmux_bin" -V)" = "tmux 3.6a"
        echo "$(dirname "$tmux_bin")" >> "$GITHUB_PATH"
        echo "bun=$(which bun)" >> "$GITHUB_OUTPUT"

    - name: Install pinned Hyperfine
      id: hyperfine
      if: inputs.hyperfine == 'true'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/hyperfine-v1.20.0-aarch64-apple-darwin.tar.gz"
        curl -fsSL \
          https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine-v1.20.0-aarch64-apple-darwin.tar.gz \
          -o "$archive"
        printf '%s  %s\n' \
          8ee7067016620447c9d2d6234ec9a4680f958b7ad983549b56334668f63075b5 \
          "$archive" | shasum -a 256 -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        binary="$RUNNER_TEMP/hyperfine-v1.20.0-aarch64-apple-darwin/hyperfine"
        test "$("$binary" --version)" = "hyperfine 1.20.0"
        echo "path=$binary" >> "$GITHUB_OUTPUT"
